
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Workshop 3 - Events and DOM</title>
    <script src="js/script.js" defer></script>
</head>
<body>
    <h1>JavaScript Events and DOM</h1>

    <h2>Exercise 1: Click Event</h2>
    <p id="message">Hello!</p>
    <button id="myButton">Click Me</button>

    <h2>Exercise 2: Keyboard Event</h2>
    <input type="text" id="nameInput" placeholder="Enter your name">
    <p id="nameOutput"></p>

    <h2>Exercise 3: Form Submission</h2>
    <form id="myForm">
        <input type="text" id="userInput" placeholder="Enter something" required>
        <button type="submit">Submit</button>
    </form>
    <p id="formOutput"></p>
</body>
</html>
